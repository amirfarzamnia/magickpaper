name: Sync Base16 Palettes
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  sync-palettes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Run Sync Script
        run: |
          chmod +x ./sync_palettes.sh
          ./sync_palettes.sh
      - name: Commit Updated Palettes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync base16 color palettes"
          file_pattern: "palettes/*.sh"
